<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#18181B"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#71717A"/>
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="816" height="266" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>

  <!-- Step 0: Input Image I -->
  <rect x="24" y="75" width="90" height="90" rx="4" fill="#F7F6F2" stroke="#18181B" stroke-width="1.5"/>
  <text x="69" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#18181B">輸入影像 I</text>
  <!-- Grid lines inside I -->
  <line x1="54" y1="75" x2="54" y2="165" stroke="#A1A1AA" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="84" y1="75" x2="84" y2="165" stroke="#A1A1AA" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="24" y1="105" x2="114" y2="105" stroke="#A1A1AA" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="24" y1="135" x2="114" y2="135" stroke="#A1A1AA" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="69" y="124" text-anchor="middle" font-size="11.5" fill="#52525B">k × k 網格</text>

  <!-- Arrow to Step 1 -->
  <line x1="118" y1="120" x2="154" y2="120" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: n Disjoint Masked Inputs -->
  <rect x="160" y="26" width="136" height="196" rx="5" fill="#F7F6F2" stroke="#A1A1AA" stroke-width="1"/>
  <text x="228" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181B">1. 隨機遮罩 n 個互斥子集</text>
  <rect x="176" y="56" width="104" height="36" rx="3" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="228" y="79" text-anchor="middle" font-size="12.5" fill="#18181B">I₁ = M<tspan baseline-shift="sub" font-size="70%">S₁</tspan> ⊙ I</text>
  <rect x="176" y="102" width="104" height="36" rx="3" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="228" y="125" text-anchor="middle" font-size="12.5" fill="#18181B">I₂ = M<tspan baseline-shift="sub" font-size="70%">S₂</tspan> ⊙ I</text>
  <text x="228" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#52525B">⋮</text>
  <rect x="176" y="164" width="104" height="36" rx="3" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="228" y="187" text-anchor="middle" font-size="12.5" fill="#18181B">Iₙ = M<tspan baseline-shift="sub" font-size="70%">Sₙ</tspan> ⊙ I</text>

  <!-- Arrow to Step 2 -->
  <line x1="300" y1="120" x2="334" y2="120" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: U-Net Inpainting Network & Partial Reconstructions -->
  <rect x="340" y="26" width="224" height="196" rx="5" fill="#F7F6F2" stroke="#18181B" stroke-width="1.5"/>
  <text x="452" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181B">2. U-Net 修補網路與局部重建</text>
  <!-- Encoder-Decoder Visual Blocks -->
  <rect x="354" y="72" width="16" height="84" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <rect x="376" y="86" width="16" height="56" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <rect x="398" y="100" width="16" height="28" fill="#E4E4E7" stroke="#18181B" stroke-width="1.2"/>
  <rect x="420" y="86" width="16" height="56" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <rect x="442" y="72" width="16" height="84" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <!-- Skip connection dashed arrows -->
  <path d="M 370 78 L 440 78" stroke="#71717A" stroke-width="1.1" stroke-dasharray="3,2" marker-end="url(#arrow-muted)"/>
  <path d="M 392 92 L 418 92" stroke="#71717A" stroke-width="1.1" stroke-dasharray="3,2" marker-end="url(#arrow-muted)"/>
  <text x="406" y="176" text-anchor="middle" font-size="11" fill="#52525B">Skip Connections</text>
  <text x="406" y="193" text-anchor="middle" font-size="11" fill="#52525B">（僅依賴鄰域像素修補）</text>

  <!-- Partial outputs I_ri -->
  <rect x="474" y="64" width="76" height="30" rx="3" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="512" y="84" text-anchor="middle" font-size="12.5" fill="#18181B">I<tspan baseline-shift="sub" font-size="70%">r1</tspan></text>
  <rect x="474" y="104" width="76" height="30" rx="3" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="512" y="124" text-anchor="middle" font-size="12.5" fill="#18181B">I<tspan baseline-shift="sub" font-size="70%">r2</tspan></text>
  <text x="512" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#52525B">⋮</text>
  <rect x="474" y="158" width="76" height="30" rx="3" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="512" y="178" text-anchor="middle" font-size="12.5" fill="#18181B">I<tspan baseline-shift="sub" font-size="70%">rn</tspan></text>

  <!-- Arrow to Step 3 -->
  <line x1="568" y1="120" x2="602" y2="120" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Re-assembly Ir & Anomaly Map MA -->
  <rect x="608" y="26" width="190" height="196" rx="5" fill="#F7F6F2" stroke="#A1A1AA" stroke-width="1"/>
  <text x="703" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181B">3. 重組影像與異常圖評估</text>

  <rect x="622" y="60" width="162" height="58" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="703" y="81" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181B">重組完整影像 I<tspan baseline-shift="sub" font-size="70%">r</tspan></text>
  <text x="703" y="103" text-anchor="middle" font-size="12" fill="#52525B">I<tspan baseline-shift="sub" font-size="70%">r</tspan> = ∑ (1 − M<tspan baseline-shift="sub" font-size="70%">Sᵢ</tspan>) ⊙ I<tspan baseline-shift="sub" font-size="70%">ri</tspan></text>

  <line x1="703" y1="120" x2="703" y2="144" stroke="#18181B" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="622" y="148" width="162" height="58" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="703" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181B">異常圖 M<tspan baseline-shift="sub" font-size="70%">A</tspan>（MSGMS）</text>
  <text x="703" y="192" text-anchor="middle" font-size="11.5" fill="#52525B">比對輸入 I 與重建影像 I<tspan baseline-shift="sub" font-size="70%">r</tspan></text>

  <!-- Bottom Reference Line from I to Step 3 -->
  <path d="M 69 167 L 69 244 L 703 244 L 703 210" fill="none" stroke="#71717A" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)"/>
  <text x="386" y="259" text-anchor="middle" font-size="11.5" fill="#52525B">輸入影像 I 與重組影像 I<tspan baseline-shift="sub" font-size="70%">r</tspan> 計算多尺度梯度相似度（MSGMS）差異</text>
</svg>
