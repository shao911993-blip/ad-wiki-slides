<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- 依 lee2026-lambda 論文 Fig. 1–3 精簡重繪（推論流程）；完整架構見 ../lee2026-lambda-fig1.svg -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F3F46"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  </defs>
  <rect x="2" y="2" width="916" height="246" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
  <!-- main row -->
  <g font-size="13" fill="#18181B" text-anchor="middle">
    <rect x="16" y="52" width="104" height="56" rx="6" fill="#F4F4F5" stroke="#A1A1AA"/>
    <text x="68" y="76" font-weight="700">輸入影像</text><text x="68" y="95" font-size="11" fill="#52525B">（可能有瑕疵）</text>

    <rect x="148" y="52" width="122" height="56" rx="6" fill="#FFFFFF" stroke="#3F3F46"/>
    <text x="209" y="76" font-weight="700">VAE 壓縮</text><text x="209" y="95" font-size="11" fill="#52525B">空間面積 ÷64</text>

    <rect x="298" y="52" width="104" height="56" rx="6" fill="#FFFFFF" stroke="#3F3F46"/>
    <text x="350" y="76" font-weight="700">加雜訊</text><text x="350" y="95" font-size="11" fill="#52525B">推論時固定步數</text>

    <rect x="430" y="44" width="150" height="72" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="505" y="72" font-weight="700">一步去雜訊</text><text x="505" y="92" font-size="11" fill="#1E40AF">朝「最像的正常樣本」</text><text x="505" y="107" font-size="11" fill="#1E40AF">的方向修正</text>

    <rect x="608" y="52" width="128" height="56" rx="6" fill="#FFFFFF" stroke="#3F3F46"/>
    <text x="672" y="76" font-weight="700">VAE 還原</text><text x="672" y="95" font-size="11" fill="#52525B">得到「正常版」</text>

    <rect x="764" y="52" width="140" height="56" rx="6" fill="#F4F4F5" stroke="#A1A1AA"/>
    <text x="834" y="76" font-weight="700">分割網路</text><text x="834" y="95" font-size="11" fill="#52525B">比對原圖 → 異常圖</text>
  </g>
  <g stroke="#3F3F46" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="120" y1="80" x2="146" y2="80"/><line x1="270" y1="80" x2="296" y2="80"/>
    <line x1="402" y1="80" x2="428" y2="80"/><line x1="580" y1="80" x2="606" y2="80"/>
    <line x1="736" y1="80" x2="762" y2="80"/>
    <path d="M68 108 V138 H834 V110"/>
  </g>
  <text x="230" y="133" font-size="11" fill="#52525B" text-anchor="middle">原圖也送進分割網路一起比對</text>
  <!-- memory bank + guidance -->
  <g font-size="13" text-anchor="middle">
    <rect x="300" y="168" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-dasharray="5 3"/>
    <text x="400" y="192" font-weight="700" fill="#18181B">記憶庫</text><text x="400" y="212" font-size="11" fill="#1E40AF">200 張正常品的壓縮表示</text>
    <rect x="530" y="168" width="230" height="62" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-dasharray="5 3"/>
    <text x="645" y="192" font-weight="700" fill="#18181B">引導尺度圖</text><text x="645" y="212" font-size="11" fill="#1E40AF">越可疑的位置，引導越強</text>
  </g>
  <g stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#g)">
    <path d="M440 168 V118"/><path d="M570 168 V118"/>
  </g>
  <text x="16" y="30" font-size="12" font-weight="700" fill="#18181B">LAMBDA 推論流程（精簡版）</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
