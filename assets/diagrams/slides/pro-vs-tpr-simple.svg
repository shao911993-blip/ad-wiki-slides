<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- 依 hecklerkram2025-mvtec-ad-2 論文 Fig. 4 情境 iv 精簡重繪；完整四種情境見 ../hecklerkram2025-mvtec-ad-2-fig4.svg -->
  <rect x="2" y="2" width="916" height="246" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
  <text x="16" y="30" font-size="12" font-weight="700" fill="#18181B">論文示例：圖中有 3 個瑕疵，模型只抓到最大的</text>
  <text x="904" y="30" font-size="10.5" fill="#71717A" text-anchor="end">方塊大小僅示意，未按像素面積比例繪製</text>
  <!-- image frame -->
  <rect x="24" y="48" width="300" height="180" rx="4" fill="#FAFAFA" stroke="#A1A1AA"/>
  <!-- small defects (missed) -->
  <rect x="58" y="78" width="36" height="36" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="76" y="132" font-size="11" fill="#DC2626" text-anchor="middle">4 px 漏掉</text>
  <rect x="128" y="160" width="26" height="26" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="141" y="204" font-size="11" fill="#DC2626" text-anchor="middle">2 px 漏掉</text>
  <!-- big defect (detected) -->
  <rect x="190" y="70" width="110" height="110" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="245" y="130" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">20 px 抓到</text>
  <!-- TPR -->
  <rect x="356" y="56" width="540" height="76" rx="6" fill="#F4F4F5" stroke="#D4D4D8"/>
  <text x="372" y="82" font-size="14" font-weight="700" fill="#18181B">TPR：所有瑕疵像素合起來算</text>
  <text x="372" y="112" font-size="14" fill="#27272A">抓到 20 ÷ 全部 26 像素 ≈ 0.77　→ 看起來很好</text>
  <!-- PRO -->
  <rect x="356" y="148" width="540" height="76" rx="6" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="372" y="174" font-size="14" font-weight="700" fill="#18181B">PRO：每個瑕疵區域各算一次再平均</text>
  <text x="372" y="204" font-size="14" fill="#1E40AF">(0 + 0 + 1) ÷ 3 ≈ 0.33　→ 兩個小瑕疵都漏了</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
