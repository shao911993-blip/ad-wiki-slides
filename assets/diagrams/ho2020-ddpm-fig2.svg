<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#18181B"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52525B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="756" height="216" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>

  <!-- Node x_T -->
  <circle cx="95" cy="105" r="28" fill="#F7F6F2" stroke="#18181B" stroke-width="1.5"/>
  <text x="95" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#18181B">x<tspan baseline-shift="sub" font-size="70%">T</tspan></text>
  <text x="95" y="154" text-anchor="middle" font-size="12" fill="#52525B">純高斯雜訊</text>

  <!-- Arrow x_T -> ... -->
  <line x1="128" y1="105" x2="172" y2="105" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
  <text x="195" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#52525B">···</text>
  <line x1="218" y1="105" x2="262" y2="105" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow-solid)"/>

  <!-- Node x_t -->
  <circle cx="295" cy="105" r="28" fill="#F7F6F2" stroke="#18181B" stroke-width="1.5"/>
  <text x="295" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#18181B">xₜ</text>

  <!-- Reverse Process Curved Solid Arrow: x_t -> x_{t-1} -->
  <path d="M 320 90 Q 380 55 440 90" fill="none" stroke="#18181B" stroke-width="1.6" marker-end="url(#arrow-solid)"/>
  <text x="380" y="58" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181B">p<tspan baseline-shift="sub" font-size="70%">θ</tspan>(xₜ₋₁ | xₜ)</text>
  <text x="380" y="38" text-anchor="middle" font-size="11.5" fill="#52525B">反向去噪過程（Reverse Process）</text>

  <!-- Forward Process Curved Dashed Arrow: x_{t-1} -> x_t -->
  <path d="M 440 120 Q 380 155 320 120" fill="none" stroke="#52525B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="380" y="164" text-anchor="middle" font-size="13.5" fill="#52525B">q(xₜ | xₜ₋₁)</text>
  <text x="380" y="184" text-anchor="middle" font-size="11.5" fill="#71717A">前向擴散加噪過程（Forward Process）</text>

  <!-- Node x_{t-1} -->
  <circle cx="468" cy="105" r="28" fill="#F7F6F2" stroke="#18181B" stroke-width="1.5"/>
  <text x="468" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#18181B">xₜ₋₁</text>

  <!-- Arrow x_{t-1} -> ... -> x_0 -->
  <line x1="501" y1="105" x2="545" y2="105" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
  <text x="568" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#52525B">···</text>
  <line x1="591" y1="105" x2="635" y2="105" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow-solid)"/>

  <!-- Node x_0 -->
  <circle cx="668" cy="105" r="28" fill="#F7F6F2" stroke="#18181B" stroke-width="1.5"/>
  <text x="668" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#18181B">x₀</text>
  <text x="668" y="154" text-anchor="middle" font-size="12" fill="#52525B">無雜訊原始影像</text>
</svg>
