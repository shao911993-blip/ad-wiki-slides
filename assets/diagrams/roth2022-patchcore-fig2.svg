<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#18181B"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52525B"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect x="2" y="2" width="856" height="316" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>

  <!-- Left Panel: Training Phase -->
  <rect x="16" y="16" width="320" height="288" rx="5" fill="#F7F6F2" stroke="#A1A1AA" stroke-width="1"/>
  <rect x="26" y="24" width="10" height="10" fill="#52525B"/>
  <text x="42" y="34" font-size="13" font-weight="700" fill="#18181B">Training（訓練階段：建立記憶庫）</text>

  <!-- Nominal Samples -->
  <rect x="30" y="54" width="106" height="62" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="83" y="77" text-anchor="middle" font-size="12" font-weight="700" fill="#18181B">正常訓練樣本</text>
  <text x="83" y="96" text-anchor="middle" font-size="11.5" fill="#52525B">Nominal X<tspan baseline-shift="sub" font-size="72%">N</tspan></text>

  <line x1="83" y1="116" x2="83" y2="146" stroke="#18181B" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Pretrained Encoder (Training) -->
  <rect x="30" y="150" width="106" height="72" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="83" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18181B">預訓練編碼器 ϕ</text>
  <rect x="44" y="180" width="34" height="22" rx="2" fill="#E4E4E7" stroke="#18181B" stroke-width="1"/>
  <text x="61" y="195" text-anchor="middle" font-size="11" fill="#18181B">ϕ<tspan baseline-shift="sub" font-size="72%">j</tspan></text>
  <rect x="84" y="183" width="38" height="16" rx="2" fill="#E4E4E7" stroke="#18181B" stroke-width="1"/>
  <text x="103" y="195" text-anchor="middle" font-size="10.5" fill="#18181B">ϕ<tspan baseline-shift="sub" font-size="72%">j+1</tspan></text>
  <text x="83" y="214" text-anchor="middle" font-size="10" fill="#52525B">中階特徵層 (2, 3)</text>

  <!-- Arrow from Encoder to Locally Aware Patch Features -->
  <path d="M 136 186 L 158 186 L 158 88 L 178 88" fill="none" stroke="#18181B" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Locally Aware Patch Features (Training) -->
  <rect x="182" y="48" width="140" height="86" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="252" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18181B">局部感知 Patch 特徵</text>
  <text x="252" y="85" text-anchor="middle" font-size="10.5" fill="#52525B">Locally Aware Features</text>
  <text x="252" y="102" text-anchor="middle" font-size="10.5" fill="#52525B">鄰域聚合 N<tspan baseline-shift="sub" font-size="72%">p</tspan><tspan baseline-shift="super" font-size="72%">(h,w)</tspan> (p = 3)</text>
  <text x="252" y="120" text-anchor="middle" font-size="11" fill="#18181B">P<tspan baseline-shift="sub" font-size="72%">s,p</tspan>(ϕ<tspan baseline-shift="sub" font-size="72%">j</tspan>(x<tspan baseline-shift="sub" font-size="72%">i</tspan>))</text>

  <line x1="252" y1="134" x2="252" y2="162" stroke="#18181B" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Coreset Subsampling -->
  <rect x="182" y="166" width="140" height="118" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="252" y="186" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18181B">貪婪核心集下採樣</text>
  <text x="252" y="202" text-anchor="middle" font-size="10.5" fill="#52525B">Greedy Coreset</text>
  <!-- Feature dots illustration -->
  <circle cx="210" cy="224" r="2.2" fill="#A1A1AA"/>
  <circle cx="222" cy="218" r="2.2" fill="#A1A1AA"/>
  <circle cx="216" cy="232" r="3.2" fill="#18181B"/>
  <circle cx="242" cy="220" r="3.2" fill="#18181B"/>
  <circle cx="250" cy="230" r="2.2" fill="#A1A1AA"/>
  <circle cx="264" cy="222" r="2.2" fill="#A1A1AA"/>
  <circle cx="278" cy="218" r="3.2" fill="#18181B"/>
  <circle cx="288" cy="228" r="2.2" fill="#A1A1AA"/>
  <circle cx="235" cy="242" r="2.2" fill="#A1A1AA"/>
  <circle cx="268" cy="240" r="3.2" fill="#18181B"/>
  <circle cx="294" cy="242" r="2.2" fill="#A1A1AA"/>
  <text x="252" y="264" text-anchor="middle" font-size="10.5" fill="#52525B">隨機線性投影 ψ: ℝ<tspan baseline-shift="super" font-size="72%">d</tspan> → ℝ<tspan baseline-shift="super" font-size="72%">d*</tspan></text>
  <text x="252" y="278" text-anchor="middle" font-size="10.5" fill="#18181B">保留 n% 代表性特徵點</text>

  <!-- Center Panel: PatchCore Core Memory Bank & Search -->
  <rect x="354" y="42" width="152" height="236" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <text x="430" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#18181B">PatchCore</text>

  <!-- Memory Bank M -->
  <rect x="370" y="60" width="120" height="90" rx="5" fill="#F7F6F2" stroke="#18181B" stroke-width="1.4"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#18181B">Memory Bank</text>
  <text x="430" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="#18181B">M<tspan baseline-shift="sub" font-size="60%">C</tspan> ⊂ M</text>
  <text x="430" y="138" text-anchor="middle" font-size="10.5" fill="#52525B">最大代表性正常特徵庫</text>

  <!-- Arrow from Coreset to Memory Bank -->
  <path d="M 322 225 L 344 225 L 344 105 L 366 105" fill="none" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Nearest Neighbour Search -->
  <rect x="370" y="174" width="120" height="86" rx="5" fill="#F7F6F2" stroke="#18181B" stroke-width="1.4"/>
  <text x="430" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18181B">最近鄰距離檢索</text>
  <text x="430" y="213" text-anchor="middle" font-size="10.5" fill="#52525B">Nearest Neighbour</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#18181B">s* = ‖m<tspan baseline-shift="super" font-size="70%">test,*</tspan> − m*‖₂</text>
  <text x="430" y="249" text-anchor="middle" font-size="10" fill="#52525B">+ 鄰域密度重加權 w</text>

  <!-- Arrow from Memory Bank to NN Search -->
  <line x1="430" y1="150" x2="430" y2="170" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right Panel: Testing Phase -->
  <rect x="524" y="16" width="320" height="288" rx="5" fill="#F7F6F2" stroke="#A1A1AA" stroke-width="1"/>
  <rect x="534" y="24" width="10" height="10" fill="#FFFFFF" stroke="#18181B" stroke-width="1.2"/>
  <text x="550" y="34" font-size="13" font-weight="700" fill="#18181B">Testing（測試階段：異常檢測與分割）</text>

  <!-- Test Sample -->
  <rect x="734" y="54" width="96" height="72" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="782" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#18181B">測試影像</text>
  <text x="782" y="98" text-anchor="middle" font-size="11.5" fill="#52525B">Test x<tspan baseline-shift="super" font-size="72%">test</tspan></text>

  <!-- Pretrained Encoder (Testing) -->
  <rect x="634" y="54" width="82" height="72" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="675" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#18181B">預訓練 ϕ</text>
  <text x="675" y="96" text-anchor="middle" font-size="10.5" fill="#52525B">ϕ<tspan baseline-shift="sub" font-size="72%">j</tspan>, ϕ<tspan baseline-shift="sub" font-size="72%">j+1</tspan></text>
  <text x="675" y="114" text-anchor="middle" font-size="10" fill="#52525B">(固定權重)</text>

  <line x1="734" y1="90" x2="720" y2="90" stroke="#18181B" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Locally Aware Patch Features (Testing) -->
  <rect x="536" y="54" width="80" height="72" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="576" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#18181B">測試 Patch</text>
  <text x="576" y="94" text-anchor="middle" font-size="11" fill="#18181B">P(x<tspan baseline-shift="super" font-size="72%">test</tspan>)</text>
  <text x="576" y="113" text-anchor="middle" font-size="10" fill="#52525B">局部鄰域聚合</text>

  <line x1="634" y1="90" x2="620" y2="90" stroke="#18181B" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Arrow from Test Patch Features to Nearest Neighbour Search -->
  <path d="M 536 90 L 514 90 L 514 205 L 494 205" fill="none" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output 1: Image-level Anomaly Score -->
  <rect x="556" y="158" width="274" height="54" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="693" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#18181B">1. 影像級異常分數（Anomaly Score s）</text>
  <text x="693" y="199" text-anchor="middle" font-size="11" fill="#52525B">取最異常 Patch 距離 s* 乘上鄰域權重 (Eq. 6–7)</text>

  <!-- Output 2: Pixel-level Anomaly Segmentation -->
  <rect x="556" y="226" width="274" height="62" rx="4" fill="#FFFFFF" stroke="#18181B" stroke-width="1.3"/>
  <text x="693" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#18181B">2. 像素級異常分割圖（Anomaly Segmentation）</text>
  <text x="693" y="266" text-anchor="middle" font-size="11" fill="#52525B">依空間位置重排各 Patch 分數 → 雙線性上採樣 →</text>
  <text x="693" y="281" text-anchor="middle" font-size="11" fill="#52525B">高斯平滑（σ = 4）</text>

  <!-- Arrows from NN Search to Outputs -->
  <path d="M 490 222 L 532 222 L 532 185 L 552 185" fill="none" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 490 232 L 532 232 L 532 257 L 552 257" fill="none" stroke="#18181B" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
